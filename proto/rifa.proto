// Contrato gRPC entre as réplicas da API.
//
// O banco é acessado direto por SQL (pgxpool). O gRPC serve para as APIs
// conversarem entre si, e tem DOIS serviços:
//
//   Broadcast -> repassar eventos da rifa para os navegadores (tempo real)
//   Monitor   -> checar quem está vivo e avisar quando algo cai ou volta
//
// Broadcast: cada navegador fica conectado por websocket em UMA das APIs. Se a
// compra do número 42 passou pela API 1, quem está conectado na API 2 também
// precisa ver o 42 ficar ocupado. Então a API 1 chama Publish na API 2, e a
// API 2 repassa o evento aos navegadores dela.
//
// O protoc lê este arquivo e gera o código Go em gen/rifapb.

syntax = "proto3";

package rifa;

option go_package = "rifa/gen/rifapb";

service Broadcast {
  // "Aconteceu isto, avise os seus navegadores."
  rpc Publish(Event) returns (PublishResponse);
}

message Event {
  // Tipos de evento:
  //   raffle_updated  -> título/descrição/prêmio/preço mudou
  //   raffle_status   -> abriu ou fechou
  //   ticket_bought   -> alguém comprou um número
  //   raffle_drawn    -> sorteio feito
  string type = 1;
  int64 raffle_id = 2;
  // O mesmo JSON que vai para o navegador. A API que recebe não precisa
  // entender o conteúdo, só repassar.
  string payload_json = 3;
  // ID da API que gerou o evento. Serve para log e para evitar eco.
  int32 origin_api_id = 4;
}

message PublishResponse {}

// ---------------------------------------------------------------------------
// Monitor: saúde do sistema, eleição da API mestre e votação do failover
// ---------------------------------------------------------------------------
// Papéis:
//   MESTRE      -> a cada 2s, faz Ping em todas as APIs e testa os
//                  bancos. Só ela decide promover a réplica, e só depois de
//                  ganhar a votação (RequestVote) da maioria das APIs VIVAS.
//   SEGUIDORAS  -> no seu horário, só fazem Ping na mestre (não testam os
//                  bancos; isso é papel da mestre). Se a mestre não
//                  responder, começam uma eleição (algoritmo do valentão /
//                  bully): a API viva de MENOR ID vira a nova mestre.
//
// Eleição:
//   1. Quem desconfia manda Election para as APIs de ID MENOR que o seu.
//   2. Se alguma responder, ela tem prioridade: quem perguntou espera.
//      Quem recebeu Election começa a sua própria eleição.
//   3. Se ninguém de ID menor responder, a API se declara mestre e manda
//      Coordinator para todas.

service Monitor {
  // "Você está vivo?" Se responder, está. Se der timeout, caiu.
  rpc Ping(PingRequest) returns (PingResponse);

  // "Descobri que <target> agora está <state>."
  rpc ReportStatus(StatusReport) returns (StatusAck);

  // Eleição: "estou fazendo uma eleição; você (ID menor) está viva?"
  rpc Election(ElectionRequest) returns (ElectionResponse);

  // Eleição: "eu sou a nova mestre."
  rpc Coordinator(CoordinatorRequest) returns (CoordinatorAck);

  // Votação: "o primário caiu; posso promover <candidate_db>?"
  rpc RequestVote(VoteRequest) returns (VoteResponse);
}

message PingRequest {
  int32 from_id = 1; // quem está perguntando
}

message PingResponse {
  int32 node_id = 1;   // quem respondeu
  int32 master_id = 2; // quem essa API acha que é a mestre (0 = não sabe)
}

message StatusReport {
  int32 reporter_id = 1; // qual API descobriu
  string target = 2;     // "api1", "api2", "api3", "db1", "db2"
  // APIs:   "up" ou "down"
  // bancos: "primary" (aceita escrita), "replica" (só cópia) ou "down"
  string state = 3;
  int64 at_unix = 4;     // quando descobriu (segundos, UTC)
}

message StatusAck {}

message ElectionRequest {
  int32 from_id = 1; // quem começou a eleição
}

message ElectionResponse {
  int32 node_id = 1; // "estou viva e tenho prioridade (ID menor)"
}

message CoordinatorRequest {
  int32 master_id = 1; // a nova mestre
}

message CoordinatorAck {}

message VoteRequest {
  int32 from_id = 1;       // a mestre pedindo o voto
  string candidate_db = 2; // banco que ela quer promover, ex "db2"
}

message VoteResponse {
  int32 node_id = 1;
  bool granted = 2;  // concordo em promover?
  string reason = 3; // por que não (para log)
}
