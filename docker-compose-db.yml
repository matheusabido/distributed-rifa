services:
  rifa-pg:
    build: ./docker/db
    image: rifa-postgres:19
    container_name: ${CONTAINER_NAME:-rifa-pg}
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: teste
      PGPASSWORD: teste
      MY_HOST: ${MY_HOST}
      PEER_HOST: ${PEER_HOST}
      INITIAL_MASTER: ${INITIAL_MASTER}
    command: ["-c", "config_file=/etc/postgresql/postgresql.conf"]
    ports:
      - ${DB_PORT:-5432}:5432
    volumes:
      - rifa_pg_data:/var/lib/postgresql
    networks:
      - rifa_network

volumes:
  rifa_pg_data:

networks:
  rifa_network:
    external: true