# nginx: a PORTA DE ENTRADA do sistema (localhost:3000).
#
#   /          -> o frontend (arquivos estáticos gerados pelo "npm run build")
#   /api/...   -> uma das 3 APIs (balanceamento)
#   /api/ws    -> websocket, também balanceado
#
# Se uma API cair, o nginx percebe o erro e manda a requisição para a próxima.

upstream apis {
    # max_fails=1 fail_timeout=5s: depois de 1 erro, evita essa API por 5s.
    server api1:8080 max_fails=1 fail_timeout=5s;
    server api2:8080 max_fails=1 fail_timeout=5s;
    server api3:8080 max_fails=1 fail_timeout=5s;
}

server {
    listen 80;

    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://apis/;             # "/api/rifas" vira "/rifas"
        # Se não conseguir falar com uma API (caiu: erro ou demora para
        # conectar), tenta a próxima. Um 503 da API ("banco indisponível")
        # NÃO conta como API caída: vai direto para o navegador.
        proxy_next_upstream error timeout http_502 non_idempotent;
        proxy_connect_timeout 2s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ws {
        proxy_pass http://apis/ws;
        proxy_http_version 1.1;              # websocket precisa disto
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;               # conexão fica aberta muito tempo
    }
}
