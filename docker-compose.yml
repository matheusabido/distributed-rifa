# APIs (+ site): docker compose up --build
#
# Os BANCOS sobem por outro compose (docker-compose-db.yml), um por máquina
# ou os dois na mesma, todos na rede externa "rifa_network":
#   docker network create rifa_network            (uma vez)
#   docker compose -f docker-compose-db.yml --env-file docker/db/db1.env -p db1 up -d --build
#   docker compose -f docker-compose-db.yml --env-file docker/db/db2.env -p db2 up -d --build
#
#   http://localhost:3000    -> site (nginx: frontend + balanceamento das APIs)
#   localhost:8081/8082/8083 -> cada API direto (para testes)
#
#                    navegador
#                        │
#                   web (nginx :3000)
#           ┌────────────┼────────────┐
#         api1         api2         api3      ← gRPC entre elas (eleição, votação, eventos)
#           └────────────┼────────────┘
#              pgx: "quem for o primário"     (rede rifa_network)
#               ┌────────┴────────┐
#              db1  ──replica──►  db2         ← docker-compose-db.yml
#
# Antes da primeira vez: cp .env.example .env

x-api: &api
  build: .
  env_file: .env
  restart: unless-stopped
  networks: [default, rifa_network]

x-api-env: &api-env
  DB_HOSTS: ${DB_HOSTS:-db1:5432,db2:5432}
  DB_USER: postgres
  DB_PASSWORD: ${POSTGRES_PASSWORD}
  DB_NAME: ${DB_NAME}

services:
  api1:
    <<: *api
    environment:
      <<: *api-env
      NODE_ID: "1"
      PEER_APIS: 2@api2:9000,3@api3:9000
    ports: ["8081:8080"]

  api2:
    <<: *api
    environment:
      <<: *api-env
      NODE_ID: "2"
      PEER_APIS: 1@api1:9000,3@api3:9000
    ports: ["8082:8080"]

  api3:
    <<: *api
    environment:
      <<: *api-env
      NODE_ID: "3"
      PEER_APIS: 1@api1:9000,2@api2:9000
    ports: ["8083:8080"]

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    ports: ["3000:80"]
    depends_on: [api1, api2, api3]

networks:
  rifa_network:
    external: true   # criada à parte; é onde estão db1 e db2
