<!doctype html>
<!--
  Painel de teste. Abra este arquivo direto no navegador (duplo clique) com
  o sistema de pé. Para cada API mostra:
    - o que ela acha do sistema (GET /cluster, atualiza a cada 1s)
    - os eventos de tempo real que chegam no websocket dela
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de teste</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; background: #f6f6f6; color: #222; }
  h1 { font-size: 20px; }
  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
  .col { background: #fff; border-radius: 8px; padding: 12px; box-shadow: 0 1px 3px #0002; }
  .col h2 { font-size: 16px; margin: 0 0 8px; display: flex; justify-content: space-between; gap: 8px; }
  .st { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: #ddd; }
  .on { background: #c8f0cf; } .off { background: #f6c8c8; } .warn { background: #fde7b0; }
  .cl { font-size: 13px; line-height: 1.7; }
  .tag { display: inline-block; font-size: 12px; padding: 0 6px; border-radius: 4px; margin: 1px; }
  pre { background: #222; color: #cfe; padding: 8px; border-radius: 6px; font-size: 12px;
        white-space: pre-wrap; word-break: break-word; margin: 6px 0; }
</style>
</head>
<body>
<h1>Painel de teste do sistema distribuído</h1>
<p>Derrube e religue APIs e bancos (<code>docker compose stop api1</code>, <code>docker compose stop db1</code>...)
e veja cada API percebendo a mudança.</p>
<div class="cols" id="cols"></div>
<script>
  const apis = [1, 2, 3].map((n) => ({ nome: `API ${n}`, http: `http://localhost:808${n}` }));
  const cor = { up: "on", primary: "on", replica: "warn", down: "off", unknown: "" };

  for (const api of apis) {
    const col = document.createElement("div");
    col.className = "col";
    col.innerHTML = `<h2>${api.nome}<span class="st">conectando</span></h2>
      <div class="cl">...</div><div class="log"></div>`;
    document.getElementById("cols").append(col);
    const st = col.querySelector(".st"), cl = col.querySelector(".cl"), log = col.querySelector(".log");

    // visão do cluster
    setInterval(async () => {
      try {
        const v = await (await fetch(api.http + "/cluster")).json();
        const tags = (l) => l.map((i) => `<span class="tag ${cor[i.estado] || ""}">${i.nome}: ${i.estado}</span>`).join("");
        cl.innerHTML = `mestre: <b>api${v.mestre}</b>${v.mestre === v.eu ? " (sou eu)" : ""}<br>
          checo nos segundos ${v.meus_segundos.slice(0, 4).join(", ")}...<br>
          APIs: ${tags(v.apis)}<br>bancos: ${tags(v.bancos)}`;
      } catch { cl.innerHTML = "<i>fora do ar</i>"; }
    }, 1000);

    // eventos de tempo real
    const conectar = () => {
      const ws = new WebSocket(api.http.replace("http", "ws") + "/ws");
      ws.onopen = () => { st.textContent = "conectado"; st.className = "st on"; };
      ws.onclose = () => {
        st.textContent = "desconectado"; st.className = "st off";
        setTimeout(conectar, 2000);
      };
      ws.onmessage = (e) => {
        const pre = document.createElement("pre");
        pre.textContent = new Date().toLocaleTimeString() + "\n" + JSON.stringify(JSON.parse(e.data), null, 2);
        log.prepend(pre);
      };
    };
    conectar();
  }
</script>
</body>
</html>
